[project]
name = "no-idea"
version = "0.1.0"
description = "/no_idea — Telegram-бот, который ведёт живой канвас обсуждения"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiogram>=3.13,<4",
    "pydantic>=2.7",
    "openai>=1.50",
    "playwright>=1.47",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.uv]
package = false
